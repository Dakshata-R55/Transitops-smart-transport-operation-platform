spring:
  application:
    name: Spring-project
  datasource:
    url: jdbc:h2:mem:transitops
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: transitops-super-secret-key-change-in-production-min-32-chars
  expiration-ms: 86400000
analytics:
  revenue-per-km: 50
app:
  settings:
    default-depot-name: Gandhinagar Depot GJ4
    default-currency: INR
    distance-unit: Kilometers
server:
  port: 8080
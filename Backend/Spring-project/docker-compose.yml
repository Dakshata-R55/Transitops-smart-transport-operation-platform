services:
  db:
    image: mysql:8.4
    container_name: transitops-db
    environment:
      MYSQL_DATABASE: transitops
      MYSQL_USER: transitops
      MYSQL_PASSWORD: transitops
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build: .
    container_name: transitops-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: